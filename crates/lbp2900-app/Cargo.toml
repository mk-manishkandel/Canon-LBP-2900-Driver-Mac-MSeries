[package]
name = "lbp2900-app"
description = "Menu-bar helper for the LBP2900 driver: status, test page, self-update from GitHub releases"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lbp2900-app"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.30"
tray-icon = "0.19"
