[workspace]
resolver = "2"
members = [
    "crates/capt",
    "crates/rastertocapt",
    "crates/lbp2900-backend",
    "crates/lbp2900-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mk-manishkandel/Canon-LBP-2900-Driver-Mac-MSeries"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
